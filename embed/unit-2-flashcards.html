<style>

  --f-head:"Space Grotesk",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1220; --paper:#161b2c; --ink:#e7eaf4; --muted:#9aa3b9; --line:#2a3249;
  --grid:rgba(142,162,255,.05); --accent:#8ea2ff; --accent-ink:#0e1220; --accent-soft:#222b4b;
  --box:#05070c; --box-ink:#f3f5f8; --box-dim:#9aa3b9;
  --good:#5fd39a; --good-soft:#163427; --bad:#ff7a7a; --bad-soft:#3a1c1f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1220; --paper:#161b2c; --ink:#e7eaf4; --muted:#9aa3b9; --line:#2a3249;
  --grid:rgba(142,162,255,.05); --accent:#8ea2ff; --accent-ink:#0e1220; --accent-soft:#222b4b;
  --box:#05070c; --box-ink:#f3f5f8; --box-dim:#9aa3b9;
  --good:#5fd39a; --good-soft:#163427; --bad:#ff7a7a; --bad-soft:#3a1c1f; color-scheme:dark}
body{background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}

.sub{color:var(--muted);margin:4px 0 0;max-width:60ch}
.chips{display:flex;flex-wrap:wrap;gap:8px}

.bar span{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}

.tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--accent)}
.q{font-size:21px;line-height:1.5;font-weight:500;overflow-x:auto;min-width:0}
.q .m,.ans .m{font-family:var(--f-mono);font-weight:600}
.ans{background:var(--box);color:var(--box-ink);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0;overflow-x:auto}
.ans .a{font-family:var(--f-mono);font-size:20px;font-weight:600;white-space:pre}
.ans .w{color:var(--box-dim);font-size:14.5px;line-height:1.45}
.ans .w b{color:var(--box-ink)}

.ans ol.st b{color:var(--box-ink)}

.keys{font-size:12.5px;color:var(--muted)}

.done h2{font-family:var(--f-head);font-size:24px;margin:0}
.prob{font-size:15px;font-weight:500;color:var(--muted);background:var(--accent-soft);border-radius:8px;padding:8px 12px;margin-bottom:10px}
.prob .m{color:var(--ink)}

@media (prefers-reduced-motion:reduce){.bar span{transition:none}}

<div class="wrap">
  <header>
    <h1>Unit 2 Flashcards</h1>
    <p class="sub">The small first steps behind every Unit 2 exam problem. Answer in your head or on paper, flip the card, then mark it. Cards you miss come back a few cards later.</p>

  <p class="keys"><kbd>Space</kbd> flip &nbsp; <kbd>1</kbd> missed it &nbsp; <kbd>2</kbd> got it</p>
</div>

function build(){var d=[];while(d.length<SIZE){d=d.concat(draw());}return d;}

    el.innerHTML='<h2>'+got+' got, '+miss+' missed</h2>'+(missedCards.length?'<p>Missed this round:</p><ol class="missed-list">'+missedCards.map(function(c){return '<li>'+c.q+'</li>';}).join('')+'</ol>':'<p>Clean deck. Try a new one.</p>')+'<div class="actions">'+(missedCards.length?'<button type="button" class="act miss" id="review">Review missed ('+missedCards.length+')</button>':'')+'<button type="button" class="act flip" id="again">New deck</button></div>';
